name: Studio maintenance verify

on:
  pull_request:
    paths:
      - "frontend/studio.js"
      - "frontend/studio.html"
      - "tests/studio-maintenance.test.mjs"
      - ".github/workflows/studio-maintenance.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Studio maintenance regressions
        run: node --test tests/studio-maintenance.test.mjs
