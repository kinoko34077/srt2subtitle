name: cloudflare-check

on:
  push:
    paths:
      - "cloudflare/**"
      - "backend/exo_writer.py"
      - "backend/exo_parser.py"
      - "tests/test_exo_rounding.py"
      - "tests/fixtures/exo-rounding.json"
      - ".github/workflows/cloudflare-check.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - "backend/exo_writer.py"
      - "backend/exo_parser.py"
      - "tests/test_exo_rounding.py"
      - "tests/fixtures/exo-rounding.json"
      - ".github/workflows/cloudflare-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run EXO Unicode and rounding regression tests
        run: npm test
      - name: Check local Python against the same rounding fixture
        working-directory: .
        run: python3 -m unittest discover -s tests -p test_exo_rounding.py
